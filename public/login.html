<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Signup</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    .flip-container { perspective: 1000px; }
    .flipper { transition: 0.6s; transform-style: preserve-3d; position: relative; }
    .flipped .flipper { transform: rotateY(180deg); }
    .front, .back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; }
    .back { transform: rotateY(180deg); }
    .msg { color: red; margin: 5px 0; min-height: 18px; }
    #forgotPopup { display:none; position:fixed; top:0; left:0;width:100%; height:100%; background:rgba(0,0,0,0.5);}
    #forgotPopup .content { background:#fff; padding:20px; max-width:300px; margin:100px auto; border-radius:8px; }
  </style>
</head>
<body>
  <h2 id="formTitle">Login</h2>
  <div class="flip-container" id="flipContainer">
    <div class="flipper">
      <!-- Login Form -->
      <div class="front">
        <div class="msg" id="loginMsg"></div>
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="loginBtn">Sign In</button>
        <button id="gotoSignup">Sign Up</button>
        <button id="forgotBtn">Forgot Password?</button>
      </div>
      <!-- Signup Form -->
      <div class="back">
        <div class="msg" id="signupMsg"></div>
        <input id="signupEmail" type="email" placeholder="Email" />
        <input id="signupPassword" type="password" placeholder="Password" />
        <input id="signupConfirm" type="password" placeholder="Confirm Password" />
        <button id="signupBtn">Sign Up</button>
        <button id="gotoLogin">Back to Login</button>
      </div>
    </div>
  </div>

  <!-- Forgot Password Popup -->
  <div id="forgotPopup">
    <div class="content">
      <h3>Reset Password</h3>
      <div class="msg" id="forgotMsg"></div>
      <input id="forgotEmail" type="email" placeholder="Enter your email" />
      <button id="sendResetBtn">Send Reset Email</button>
      <button id="closeForgot">Cancel</button>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script>
    const flipContainer = document.getElementById('flipContainer');
    const loginMsg = document.getElementById('loginMsg');
    const signupMsg = document.getElementById('signupMsg');
    const forgotMsg = document.getElementById('forgotMsg');
    const forgotPopup = document.getElementById('forgotPopup');

    // Flip to signup
    document.getElementById('gotoSignup').addEventListener('click', () => {
      flipContainer.classList.add('flipped');
      document.getElementById('formTitle').textContent = 'Signup';
      loginMsg.textContent = '';
    });
    // Flip back to login
    document.getElementById('gotoLogin').addEventListener('click', () => {
      flipContainer.classList.remove('flipped');
      document.getElementById('formTitle').textContent = 'Login';
      signupMsg.textContent = '';
    });

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
  loginMsg.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { 
    loginMsg.textContent = 'Email & password required'; 
    return; 
  }

  try {
    // Firebase client login
    await window.__auth.loginWithEmail(email, password);

    // Get current user and ID token
    const user = window.__auth.auth.currentUser;
    if (user) {
      const idToken = await user.getIdToken(true); // Force refresh

      // Send ID token to server to create session cookie
      await fetch("/sessionLogin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken })
      });

      // Redirect after session cookie is set
      window.location.href = "/dashboard";
    }
  } catch (e) {
    loginMsg.textContent = e.message || 'Login failed';
  }
});


    // Signup
    document.getElementById('signupBtn').addEventListener('click', async () => {
      signupMsg.textContent = '';
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      if (!email || !password || !confirm) { signupMsg.textContent = 'All fields required'; return; }
      if (password !== confirm) { signupMsg.textContent = 'Passwords do not match'; return; }
      try {
        await window.__auth.signupWithEmail(email, password);
        signupMsg.style.color = 'green';
        signupMsg.textContent = 'Signup successful! Please login.';
        // Flip to login
        setTimeout(() => {
          flipContainer.classList.remove('flipped');
          document.getElementById('formTitle').textContent = 'Login';
          signupMsg.textContent = '';
        }, 1500);
      } catch (e) {
        signupMsg.textContent = e.message || 'Signup failed';
      }
    });

    // Forgot password popup
    document.getElementById('forgotBtn').addEventListener('click', () => {
      forgotPopup.style.display = 'block';
      forgotMsg.textContent = '';
      document.getElementById('forgotEmail').value = '';
    });
    document.getElementById('closeForgot').addEventListener('click', () => {
      forgotPopup.style.display = 'none';
    });
    document.getElementById('sendResetBtn').addEventListener('click', async () => {
      forgotMsg.textContent = '';
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) { forgotMsg.textContent = 'Email required'; return; }
      try {
        await window.__auth.sendResetEmail(email);
        forgotMsg.style.color = 'green';
        forgotMsg.textContent = 'Reset email sent!';
      } catch (e) {
        forgotMsg.style.color = 'red';
        forgotMsg.textContent = e.message || 'Failed to send reset email';
      }
    });
  </script>
</body>
</html>
