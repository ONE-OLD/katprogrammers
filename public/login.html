<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <input id="email" type="email" placeholder="Email" />
<input id="password" type="password" placeholder="Password" />
<button id="loginBtn">Sign In</button>
<button id="signupBtn">Sign Up</button>
<button id="forgotBtn">Forgot Password?</button>

<script type="module" src="/js/auth.js"></script>
<script>
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await window.__auth.loginWithEmail(email, password);
      window.location.href = '/dashboard';
    } catch (e) {
      alert('Login failed: ' + (e?.message || e));
    }
  });

  document.getElementById('signupBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await window.__auth.signupWithEmail(email, password);
      alert('Signup successful! Please login.');
    } catch (e) {
      alert('Signup failed: ' + (e?.message || e));
    }
  });

  document.getElementById('forgotBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) return alert('Enter your email for password reset.');
    try {
      await window.__auth.sendResetEmail(email);
      alert('Password reset email sent!');
    } catch (e) {
      alert('Failed: ' + (e?.message || e));
    }
  });
</script>

</body>
</html>
