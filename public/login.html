<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/private-views/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="index.html" class="logo">
      <i class="fas fa-shield-alt"></i>
      <span>AuthPortal</span>
    </a>
    
    <ul class="nav-menu">
      <li class="nav-item">
        <a href="index.html" class="nav-link">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="dashboard.html" class="nav-link">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="profile.html" class="nav-link">
          <i class="fas fa-user"></i>
          <span>Profile</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="login.html" class="nav-link active">
          <i class="fas fa-sign-in-alt"></i>
          <span>Login</span>
        </a>
      </li>
    </ul>
    
    <div class="theme-toggle-container">
      <button class="theme-toggle" id="themeToggle"></button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">Login / Signup</h1>
    
    <div class="flip-container" id="flipContainer">
      <div class="flipper">
        <!-- Login Form -->
        <div class="front">
          <div class="auth-form">
            <div class="auth-msg" id="loginMsg"></div>
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <div class="auth-action">
              <button id="loginBtn" class="btn btn-primary auth-btn">Sign In</button>
              <button id="gotoSignup" class="btn btn-secondary auth-btn">Sign Up</button>
            </div>
            <button id="forgotBtn" class="btn btn-secondary" style="width:100%; margin-top:1rem;">
              <i class="fas fa-key"></i> Forgot Password?
            </button>
          </div>
        </div>
        
        <!-- Signup Form -->
        <div class="back">
          <div class="auth-form">
            <div class="auth-msg" id="signupMsg"></div>
            <div class="form-group">
              <label for="signupEmail">Email</label>
              <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
              <label for="signupPassword">Password</label>
              <input type="password" id="signupPassword" placeholder="Create a password">
            </div>
            <div class="form-group">
              <label for="signupConfirm">Confirm Password</label>
              <input type="password" id="signupConfirm" placeholder="Confirm your password">
            </div>
            <div class="auth-action">
              <button id="signupBtn" class="btn btn-primary auth-btn">Sign Up</button>
              <button id="gotoLogin" class="btn btn-secondary auth-btn">Back to Login</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Forgot Password Popup -->
    <div id="forgotPopup" class="popup" style="display: none;">
      <div class="popup-content">
        <h3 class="popup-title">Reset Password</h3>
        <div class="auth-msg" id="forgotMsg"></div>
        <div class="form-group">
          <label for="forgotEmail">Email Address</label>
          <input type="email" id="forgotEmail" placeholder="Enter your email">
        </div>
        <div class="popup-actions">
          <button id="closeForgot" class="btn btn-secondary">Cancel</button>
          <button id="sendResetBtn" class="btn btn-primary">Send Reset Email</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/js/auth.js"></script>
  <script>
    const flipContainer = document.getElementById('flipContainer');
    const loginMsg = document.getElementById('loginMsg');
    const signupMsg = document.getElementById('signupMsg');
    const forgotMsg = document.getElementById('forgotMsg');
    const forgotPopup = document.getElementById('forgotPopup');
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.body.setAttribute('data-theme', currentTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    // Flip to signup
    document.getElementById('gotoSignup').addEventListener('click', () => {
      flipContainer.classList.add('flipped');
      document.getElementById('formTitle').textContent = 'Signup';
      loginMsg.textContent = '';
    });
    
    // Flip back to login
    document.getElementById('gotoLogin').addEventListener('click', () => {
      flipContainer.classList.remove('flipped');
      document.getElementById('formTitle').textContent = 'Login';
      signupMsg.textContent = '';
    });

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
      loginMsg.textContent = '';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { 
        loginMsg.textContent = 'Email & password required'; 
        return; 
      }

      try {
        await window.__auth.loginWithEmail(email, password);
        const user = window.__auth.auth.currentUser;
        if (user) {
          const idToken = await user.getIdToken(true);
          
          // FIX: Added credentials
          await fetch("/sessionLogin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: 'include',
            body: JSON.stringify({ idToken })
          });

          window.location.href = "/dashboard";
        }
      } catch (e) {
        loginMsg.textContent = e.message || 'Login failed';
      }
    });

    // Signup
    document.getElementById('signupBtn').addEventListener('click', async () => {
      signupMsg.textContent = '';
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      if (!email || !password || !confirm) { signupMsg.textContent = 'All fields required'; return; }
      if (password !== confirm) { signupMsg.textContent = 'Passwords do not match'; return; }
      try {
        await window.__auth.signupWithEmail(email, password);
        signupMsg.style.color = 'green';
        signupMsg.textContent = 'Signup successful! Please login.';
        setTimeout(() => {
          flipContainer.classList.remove('flipped');
          document.getElementById('formTitle').textContent = 'Login';
          signupMsg.textContent = '';
        }, 1500);
      } catch (e) {
        signupMsg.textContent = e.message || 'Signup failed';
      }
    });

    // Forgot password popup
    document.getElementById('forgotBtn').addEventListener('click', () => {
      forgotPopup.style.display = 'block';
      forgotMsg.textContent = '';
      document.getElementById('forgotEmail').value = '';
    });
    document.getElementById('closeForgot').addEventListener('click', () => {
      forgotPopup.style.display = 'none';
    });
    document.getElementById('sendResetBtn').addEventListener('click', async () => {
      forgotMsg.textContent = '';
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) { forgotMsg.textContent = 'Email required'; return; }
      try {
        await window.__auth.sendResetEmail(email);
        forgotMsg.style.color = 'green';
        forgotMsg.textContent = 'Reset email sent!';
      } catch (e) {
        forgotMsg.style.color = 'red';
        forgotMsg.textContent = e.message || 'Failed to send reset email';
      }
    });
  </script>
</body>
</html>
