<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Kat-Programmers</title>
  <!-- Fixed CSS path -->
  <link rel="stylesheet" href="/private/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
    <!-- Mobile Sidebar Toggle -->
  <button class="sidebar-toggle" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false" id="sidebarToggle">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <!-- Sidebar -->
    <aside class="sidebar sidebar--offcanvas" id="sidebar" aria-label="Primary">
      <div class="sidebar__hdr">
        <img src="./assets/images/image (1).png" alt="KAT-PROGRAMMERS logo" />
        <div class="sidebar__title">KAT-PROGRAMMERS</div>
      </div>
      
      <nav class="sidebar__nav" role="navigation">
        <div class="nav__group" aria-label="Main links">
          <a class="nav__link" href="/dashboard"  aria-current="page"><span class="nav__icon"><i class="fa-solid fa-house"></i></span><span>Home</span></a>
          <a class="nav__link" href="/tutorials"><span class="nav__icon"><i class="fa-solid fa-film"></i></span><span>Videos</span></a>
          <a class="nav__link" href="/news"><span class="nav__icon"><i class="fa-solid fa-newspaper"></i></span><span>News</span></a>
          <a class="nav__link" href="/certificate"><span class="nav__icon"><i class="fa-brands fa-uncharted"></i></span><span>Courses</span></a>
          <a class="nav__link" href="/apps"><span class="nav__icon"><i class="fa-brands fa-app-store"></i></span><span>App Store</span></a>
        </div>

        <div class="user-info" style="padding: 16px; border-top: 1px solid var(--bg-surface);">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--accent-primary); display: grid; place-items: center;">
              <i class="fa-solid fa-user" style="color: white;"></i>
            </div>
            <div>
              <h4>Already Login</h4>
            </div>
          </div>
        </div>

        <div class="sidebar__footer">
          <a class="nav__link" href="/about"><span class="nav__icon"><i class="fa-solid fa-circle-user"></i></span><span>About</span></a>
          <button class="nav__link" id="logoutBtn" style="width:100%; background:transparent; border:0; text-align:left; cursor: pointer;">
            <span class="nav__icon"><i class="fa-solid fa-right-from-bracket"></i></span>
            <span>Log Out</span>
          </button>
        </div>
        
        <div class="theme-toggle-row" aria-live="polite">
          <span>Theme</span>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme" aria-pressed="false"></button>
        </div>
      </nav>
    </aside>
<header class="site-hdr">
        <div class="site-hdr__inner">
          <div>
            <h2 style="margin:.4rem 0 0; font-size:1.6rem; font-weight:800; margin-left: 60px;">Dashboard</h2>
          </div>
        </div>
      </header>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">User Profile</h1>
    
    <div class="card">
      <h2 class="card-title">Account Information</h2>
      <div class="info-item">
        <span class="info-label">Email:</span>
        <span class="info-value" id="userEmail">Loading...</span>
      </div>
      <div class="info-item">
        <span class="info-label">User ID:</span>
        <span class="info-value" id="userUid">Loading...</span>
      </div>
      
      <hr>
      
      <h2 class="card-title">Change Password</h2>
      <form id="passwordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password" required>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-key"></i> Change Password
        </button>
      </form>
      
      <hr>
      
      <h2 class="card-title">Danger Zone</h2>
      <button id="deleteBtn" class="btn btn-danger">
        <i class="fas fa-trash-alt"></i> Delete Account
      </button>
      
      <hr>
      
      <!-- FIXED: unique ID -->
      <button id="logoutBtn" class="btn btn-secondary">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
      
      <hr>
      
      <h2 class="card-title">Recent Activity</h2>
      <ul class="activity-list" id="activityList"></ul>
    </div>
  </main>

  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', currentTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    // Fetch user info
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/api/me', {
          credentials: 'include' // Include cookies for auth
        });
        
        if (response.ok) {
          const user = await response.json();
          document.getElementById('userEmail').textContent = user.email;
          document.getElementById('userUid').textContent = user.uid;
        } else {
          // If not logged in, hide the user info section
          document.querySelector('.user-info').style.display = 'none';
        }
      } catch (error) {
        console.error('Failed to fetch user info:', error);
        document.querySelector('.user-info').style.display = 'none';
      }
    });

    async function loadActivity() {
      const res = await fetch('/api/activity', { credentials: 'include' });
      if (res.ok) {
        const data = await res.json();
        const list = document.getElementById('activityList');
        list.innerHTML = data.map(a => `<li>${a.type} - ${new Date(a.timestamp).toLocaleString()}</li>`).join('');
      }
    }

    // Change password
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      if (!newPassword) return;

      const res = await fetch('/api/changePassword', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ newPassword })
      });

      if (res.ok) {
        alert('Password changed successfully! Please log in again.');
        await logout();
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Failed to change password: ' + (err.error || 'Unknown error'));
      }
    });

    // Delete account
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete your account? This cannot be undone!')) return;

      const res = await fetch('/api/deleteAccount', {
        method: 'DELETE',
        credentials: 'include'
      });

      if (res.ok) {
        alert('Account deleted.');
        window.location.href = '/';
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Failed to delete account: ' + (err.error || 'Unknown error'));
      }
    });

  </script>
  <script>
// Cross-tab logout communication with fallback
function setupCrossTabLogout() {
  let logoutChannel;
  
  // Check if BroadcastChannel is supported
  if (typeof BroadcastChannel !== 'undefined') {
    // Use BroadcastChannel (modern browsers)
    logoutChannel = new BroadcastChannel('logout-channel');
    
    // Listen for logout messages from other tabs
    logoutChannel.addEventListener('message', (event) => {
      if (event.data.type === 'logout') {
        console.log('Logout detected from another tab via BroadcastChannel');
        window.location.replace('/');
      }
    });
  } else {
    // Fallback for browsers that don't support BroadcastChannel
    console.log('BroadcastChannel not supported, using localStorage fallback');
    
    // Listen for storage events (logout events from other tabs)
    window.addEventListener('storage', function(event) {
      if (event.key === 'logout-event' && event.newValue) {
        console.log('Logout detected from another tab via localStorage');
        window.location.replace('/');
      }
    });
    
    // Also check for logout event on page load as a fallback
    if (localStorage.getItem('logout-event')) {
      console.log('Logout detected on page load via localStorage');
      window.location.replace('/');
    }
  }

  // Enhanced authentication check
  async function checkAuthStatus() {
    try {
      const response = await fetch('/api/me', {
        credentials: 'include',
        headers: {
          'Cache-Control': 'no-cache'
        }
      });
      
      if (!response.ok) {
        window.location.replace('/login');
      }
    } catch (error) {
      console.error('Auth check failed:', error);
      window.location.replace('/login');
    }
  }

  // Check auth on various events
  document.addEventListener('DOMContentLoaded', checkAuthStatus);
  window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
      checkAuthStatus();
    }
  });
  window.addEventListener('focus', checkAuthStatus);
  
  // Optional: Periodic check (every 30 seconds)
  setInterval(checkAuthStatus, 30000);
  
  // Update the logout button handler
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", async function() {
      const originalContent = logoutBtn.innerHTML;
      logoutBtn.disabled = true;
      logoutBtn.innerHTML = '<span class="nav__icon"><i class="fa-solid fa-spinner fa-spin"></i></span><span>Logging out...</span>';

      try {
        const response = await fetch('/sessionLogout', {
          method: 'POST',
          credentials: 'include'
        });
        
        if (response.ok) {
          // Broadcast logout to other tabs using the available method
          if (logoutChannel) {
            // Use BroadcastChannel if available
            logoutChannel.postMessage({ type: 'logout', timestamp: Date.now() });
          } else {
            // Use localStorage fallback
            localStorage.setItem('logout-event', Date.now().toString());
            // Immediately remove it to allow detecting future logouts
            setTimeout(() => localStorage.removeItem('logout-event'), 100);
          }
          
          window.location.replace('/');
        } else {
          throw new Error('Logout failed');
        }
      } catch (error) {
        console.error('Logout error:', error);
        logoutBtn.disabled = false;
        logoutBtn.innerHTML = originalContent;
        alert('Logout failed. Please try again.');
      }
    });
  }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', setupCrossTabLogout);
</script>
</body>
</html>
