<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <script type="module" src="/utils/auth.js"></script>
</head>
<body>
  <h1>Profile Page</h1>

  <div id="userInfo">
    <p>Email: <span id="userEmail"></span></p>
  </div>

  <h2>Activity History</h2>
  <ul id="activityList">
    <li>Loading activity...</li>
  </ul>

  <h2>Account Management</h2>
  <button id="changePasswordBtn">Change Password</button>
  <button id="deleteAccountBtn">Delete Account</button>
  <button id="logoutBtn">Logout</button>

  <script type="module">
    import {
      getAuth,
      onAuthStateChanged,
      EmailAuthProvider,
      reauthenticateWithCredential,
      updatePassword,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const auth = getAuth();

    // Show logged-in user's email
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }
      document.getElementById("userEmail").textContent = user.email;

      // Load activity history
      try {
        const res = await fetch("/api/activity");
        if (!res.ok) throw new Error("Failed to load activity");
        const data = await res.json();
        const list = document.getElementById("activityList");
        list.innerHTML = "";
        if (data.length === 0) {
          list.innerHTML = "<li>No activity found</li>";
        } else {
          data.forEach(act => {
            const li = document.createElement("li");
            li.textContent = `${act.date} - ${act.action}`;
            list.appendChild(li);
          });
        }
      } catch (err) {
        console.error(err);
        document.getElementById("activityList").innerHTML = "<li>Error loading activity</li>";
      }
    });

    // Change password
    document.getElementById("changePasswordBtn").addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) return;

      const currentPassword = prompt("Enter your current password:");
      const newPassword = prompt("Enter your new password:");
      if (!currentPassword || !newPassword) return;

      try {
        const cred = EmailAuthProvider.credential(user.email, currentPassword);
        await reauthenticateWithCredential(user, cred);
        await updatePassword(user, newPassword);
        alert("Password updated successfully!");
      } catch (err) {
        console.error(err);
        alert("Failed to change password: " + err.message);
      }
    });

    // Delete account
    document.getElementById("deleteAccountBtn").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to delete your account? This cannot be undone.")) return;
      try {
        await deleteUser(auth.currentUser);
        await window.__auth.logout();
        window.location.href = "/";
      } catch (err) {
        console.error(err);
        alert("Failed to delete account: " + err.message);
      }
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await window.__auth.logout();
      window.location.href = "/";
    });
  </script>
</body>
</html>
