<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>Profile</h1>

  <div id="userInfo">
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>UID:</strong> <span id="uid"></span></p>
  </div>

  <hr>

  <h2>Change Password</h2>
  <form id="passwordForm">
    <input type="password" id="newPassword" placeholder="New Password" required>
    <button type="submit">Change Password</button>
  </form>

  <hr>

  <h2>Danger Zone</h2>
  <button id="deleteBtn" style="background: red; color: white;">Delete Account</button>

  <hr>

  <button id="logoutBtn">Logout</button>

  <hr>

  <h2>Activity</h2>
  <ul id="activityList"></ul>

  <script>
    async function api(url, options = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        ...options
      });
      if (!res.ok) throw new Error(`Request failed: ${res.status}`);
      return res.json();
    }

    // Load user info
    async function loadUser() {
      const data = await api("/api/me");
      document.getElementById("email").textContent = data.email;
      document.getElementById("uid").textContent = data.uid;
    }

    // Load activity
    async function loadActivity() {
      const activities = await api("/api/activity");
      const list = document.getElementById("activityList");
      list.innerHTML = "";
      activities.forEach(act => {
        const li = document.createElement("li");
        li.textContent = `${act.timestamp} — ${act.type}`;
        list.appendChild(li);
      });
    }

    // Change password
    document.getElementById("passwordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      try {
        await api("/api/changePassword", {
          method: "POST",
          body: JSON.stringify({ newPassword })
        });
        alert("Password changed successfully");
        document.getElementById("newPassword").value = "";
      } catch (err) {
        alert("Failed to change password: " + err.message);
      }
    });

    // Delete account
    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to delete your account? This cannot be undone.")) return;
      try {
        await api("/api/deleteAccount", { method: "DELETE" });
        alert("Account deleted");
        window.location.href = "/";
      } catch (err) {
        alert("Failed to delete account: " + err.message);
      }
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await api("/sessionLogout", { method: "POST" });
      window.location.href = "/";
    });

    // Initial load
    loadUser();
    loadActivity();
  </script>
</body>
</html>
