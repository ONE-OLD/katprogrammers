<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Kat-Programmers</title>
  <!-- Fixed CSS path -->
  <link rel="stylesheet" href="/private/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="https://via.placeholder.com/40" alt="KAT-PROGRAMMERS Logo">
      <h2>KAT-PROGRAMMERS</h2>
    </div>
    <ul class="sidebar-links">
      <li><a href="home.html" class="home"><span><i class="fa-solid fa-house"></i></span><p>Home</p></a></li>
      <li><a href="tutorials.html"><span><i class="fa-solid fa-film"></i></span><p>Videos</p></a></li>
      <li><a href="#"><span><i class="fa-solid fa-newspaper"></i></span><p>News</p></a></li>
      <li><a href="#"><span><i class="fa-brands fa-uncharted"></i></span><p>Courses</p></a></li>
      <li><a href="apps.html"><span><i class="fa-brands fa-app-store"></i></span><p>App Store</p></a></li>
      <div class="sidebar-bottom">
        <li><a href="/private/profile"><span><i class="fa-solid fa-circle-user"></i></span><p>Profile</p></a></li>
        <!-- FIXED: unique ID -->
        <li><button id="sidebarLogoutBtn"><span><i class="fa-solid fa-right-from-bracket"></i></span><p>Log Out</p></button></li>
      </div>
    </ul>
    <div class="theme-toggle-container">
      <button class="theme-toggle" id="themeToggle"></button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">User Profile</h1>
    
    <div class="card">
      <h2 class="card-title">Account Information</h2>
      <div class="info-item">
        <span class="info-label">Email:</span>
        <span class="info-value" id="email">Loading...</span>
      </div>
      <div class="info-item">
        <span class="info-label">User ID:</span>
        <span class="info-value" id="uid">Loading...</span>
      </div>
      
      <hr>
      
      <h2 class="card-title">Change Password</h2>
      <form id="passwordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password" required>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-key"></i> Change Password
        </button>
      </form>
      
      <hr>
      
      <h2 class="card-title">Danger Zone</h2>
      <button id="deleteBtn" class="btn btn-danger">
        <i class="fas fa-trash-alt"></i> Delete Account
      </button>
      
      <hr>
      
      <!-- FIXED: unique ID -->
      <button id="mainLogoutBtn" class="btn btn-secondary">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
      
      <hr>
      
      <h2 class="card-title">Recent Activity</h2>
      <ul class="activity-list" id="activityList"></ul>
    </div>
  </main>

  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', currentTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    async function loadProfile() {
      const res = await fetch('/api/me', { credentials: 'include' });
      if (res.ok) {
        const data = await res.json();
        document.getElementById('email').textContent = data.email;
        document.getElementById('uid').textContent = data.uid;
      } else {
        window.location.href = '/login';
      }
    }

    async function loadActivity() {
      const res = await fetch('/api/activity', { credentials: 'include' });
      if (res.ok) {
        const data = await res.json();
        const list = document.getElementById('activityList');
        list.innerHTML = data.map(a => `<li>${a.type} - ${new Date(a.timestamp).toLocaleString()}</li>`).join('');
      }
    }

    // Change password
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      if (!newPassword) return;

      const res = await fetch('/api/changePassword', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ newPassword })
      });

      if (res.ok) {
        alert('Password changed successfully! Please log in again.');
        await logout();
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Failed to change password: ' + (err.error || 'Unknown error'));
      }
    });

    // Delete account
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete your account? This cannot be undone!')) return;

      const res = await fetch('/api/deleteAccount', {
        method: 'DELETE',
        credentials: 'include'
      });

      if (res.ok) {
        alert('Account deleted.');
        window.location.href = '/';
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Failed to delete account: ' + (err.error || 'Unknown error'));
      }
    });

    // Shared logout function
    async function logout() {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      localStorage.removeItem('theme'); // clear theme if needed
      window.location.href = '/login';
    }

    // Attach logout to both buttons
    document.getElementById('sidebarLogoutBtn').addEventListener('click', logout);
    document.getElementById('mainLogoutBtn').addEventListener('click', logout);

    // Load on page start
    loadProfile();
    loadActivity();

    // Prevent going back after logout
    window.addEventListener('pageshow', (event) => {
      if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
