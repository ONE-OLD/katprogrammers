<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    h2 { margin-top: 20px; }
    .msg { color: red; margin: 5px 0; min-height: 18px; }
  </style>
</head>
<body>
  <h1>Profile Management</h1>

  <div id="profileInfo">
    <p>Email: <span id="email"></span></p>
    <p>UID: <span id="uid"></span></p>
  </div>



  <h2>Change Password</h2>
  <div class="msg" id="passMsg"></div>
  <input id="currentPass" type="password" placeholder="Current password" />
  <input id="newPass" type="password" placeholder="New password" />
  <button id="changePassBtn">Change Password</button>

  <h2>Danger Zone</h2>
  <div class="msg" id="deleteMsg"></div>
  <button id="deleteAccountBtn" style="background:red;color:white;">Delete Account</button>

  <button id="logoutBtn">Logout</button>
  <p><a href="/dashboard">← Back to Dashboard</a></p>

  <script type="module" src="/js/auth.js"></script>
  <script>
const emailEl = document.getElementById('email');
const uidEl = document.getElementById('uid');
const passMsg = document.getElementById('passMsg');
const deleteMsg = document.getElementById('deleteMsg');
const activityListEl = document.getElementById('activityList');
const activityMsgEl = document.getElementById('activityMsg');


async function loadProfile() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) {
      window.location.href = '/login.html';
      return;
    }
    const user = await res.json();
    emailEl.textContent = user.email;
    uidEl.textContent = user.uid;

    // Load activity
    await loadActivity(user.uid);
  } catch {
    window.location.href = '/login.html';
  }
}

async function loadActivity(uid) {
  activityListEl.innerHTML = '';
  activityMsgEl.textContent = '';
  try {
    const res = await fetch('/api/activity');
    if (!res.ok) { activityMsgEl.textContent = 'Failed to load activity'; return; }
    const activities = await res.json();
    if (!activities.length) { activityMsgEl.textContent = 'No activity yet'; return; }

    activities.forEach(a => {
      const li = document.createElement('li');
      li.textContent = `${new Date(a.timestamp).toLocaleString()} — ${a.type}${a.extra ? ' — ' + a.extra : ''}`;
      activityListEl.appendChild(li);
    });
  } catch (e) {
    activityMsgEl.textContent = 'Error loading activity';
  }
}

loadProfile();

// Password change, delete account, logout remain same
</script>
</body>
</html>
