<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <!-- Fixed CSS path -->
  <link rel="stylesheet" href="/private/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/" class="logo">
      <i class="fas fa-shield-alt"></i>
      <span>AuthPortal</span>
    </a>
    
    <ul class="nav-menu">
      <li class="nav-item">
        <a href="/" class="nav-link">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/dashboard" class="nav-link">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/profile" class="nav-link active">
          <i class="fas fa-user"></i>
          <span>Profile</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/login" class="nav-link">
          <i class="fas fa-sign-in-alt"></i>
          <span>Login</span>
        </a>
      </li>
    </ul>
    
    <div class="theme-toggle-container">
      <button class="theme-toggle" id="themeToggle"></button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">User Profile</h1>
    
    <div class="card">
      <h2 class="card-title">Account Information</h2>
      <div class="info-item">
        <span class="info-label">Email:</span>
        <span class="info-value" id="email">Loading...</span>
      </div>
      <div class="info-item">
        <span class="info-label">User ID:</span>
        <span class="info-value" id="uid">Loading...</span>
      </div>
      
      <hr>
      
      <h2 class="card-title">Change Password</h2>
      <form id="passwordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password" required>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-key"></i> Change Password
        </button>
      </form>
      
      <hr>
      
      <h2 class="card-title">Danger Zone</h2>
      <button id="deleteBtn" class="btn btn-danger">
        <i class="fas fa-trash-alt"></i> Delete Account
      </button>
      
      <hr>
      
      <button id="profileLogoutBtn" class="btn btn-secondary">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
      
      <hr>
      
      <h2 class="card-title">Recent Activity</h2>
      <!-- Removed placeholder items; will populate dynamically -->
      <ul class="activity-list" id="activityList"></ul>
    </div>
  </main>

  <script>
    // Theme toggle functionality (unchanged)
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.body.setAttribute('data-theme', currentTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    async function loadProfile() {
      const res = await fetch('/api/me', { credentials: 'include' });
      if (res.ok) {
        const data = await res.json();
        document.getElementById('email').textContent = data.email;
        document.getElementById('uid').textContent = data.uid;
      } else {
        window.location.href = '/login';
      }
    }

    async function loadActivity() {
      const res = await fetch('/api/activity', { credentials: 'include' });
      if (res.ok) {
        const data = await res.json();
        const list = document.getElementById('activityList');
        list.innerHTML = data.map(a => `<li>${a.type} - ${new Date(a.timestamp).toLocaleString()}</li>`).join('');
      }
    }

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      if (!newPassword) return;

      const res = await fetch('/api/changePassword', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ newPassword })
      });

      if (res.ok) {
        alert('Password changed successfully! Please log in again.');
        await logout();
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Failed to change password: ' + (err.error || 'Unknown error'));
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete your account? This cannot be undone!')) return;

      const res = await fetch('/api/deleteAccount', {
        method: 'DELETE',
        credentials: 'include'
      });

      if (res.ok) {
        alert('Account deleted.');
        window.location.href = '/';
      } else {
        const err = await res.json().catch(() => ({}));
        alert('Failed to delete account: ' + (err.error || 'Unknown error'));
      }
    });

    

    // FIXED: Correct logout button
    document.getElementById('profileLogoutBtn').addEventListener('click', logout);

    // Load on page start
    loadProfile();
    loadActivity();
  </script>
  <script>
  window.addEventListener('pageshow', (event) => {
    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
      // Reload page if it was loaded from bfcache (back-forward cache)
      window.location.reload();
    }
  });
</script>

</body>
</html>
