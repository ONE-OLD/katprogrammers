<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>Profile</h1>

  <div id="userInfo">
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>UID:</strong> <span id="uid"></span></p>
  </div>

  <hr>

  <h2>Change Password</h2>
  <form id="passwordForm">
    <input type="password" id="newPassword" placeholder="New Password" required>
    <button type="submit">Change Password</button>
  </form>

  <hr>

  <h2>Danger Zone</h2>
  <button id="deleteBtn" style="background: red; color: white;">Delete Account</button>

  <hr>

  <button id="logoutBtn">Logout</button>

  <hr>

  <h2>Activity</h2>
  <ul id="activityList"></ul>

  <script>
async function loadProfile() {
  const res = await fetch('/api/me', { credentials: 'include' });
  if (res.ok) {
    const data = await res.json();
    document.getElementById('profileEmail').textContent = data.email;
  } else {
    window.location.href = '/login.html';
  }
}

async function loadActivity() {
  const res = await fetch('/api/activity', { credentials: 'include' });
  if (res.ok) {
    const data = await res.json();
    const list = document.getElementById('activityList');
    list.innerHTML = data.map(a => `<li>${a.type} - ${a.timestamp}</li>`).join('');
  } else {
    console.error('Failed to load activity');
  }
}

document.getElementById('changePasswordBtn').addEventListener('click', async () => {
  const newPassword = prompt('Enter your new password:');
  if (!newPassword) return;

  const res = await fetch('/api/changePassword', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ newPassword })
  });

  if (res.ok) {
    alert('Password changed successfully! Please log in again.');
    await logout();
  } else {
    const err = await res.json().catch(() => ({}));
    alert('Failed to change password: ' + (err.error || 'Unknown error'));
  }
});

document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
  if (!confirm('Are you sure you want to delete your account? This cannot be undone!')) return;

  const res = await fetch('/api/deleteAccount', {
    method: 'DELETE',
    credentials: 'include'
  });

  if (res.ok) {
    alert('Account deleted.');
    window.location.href = '/';
  } else {
    const err = await res.json().catch(() => ({}));
    alert('Failed to delete account: ' + (err.error || 'Unknown error'));
  }
});

async function logout() {
  await fetch('/sessionLogout', {
    method: 'POST',
    credentials: 'include'
  });
  window.location.href = '/';
}

document.getElementById('logoutBtn').addEventListener('click', logout);

// Load on page start
loadProfile();
loadActivity();
</script>

</body>
</html>
