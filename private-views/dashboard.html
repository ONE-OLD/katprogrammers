<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="index.html" class="logo">
      <i class="fas fa-shield-alt"></i>
      <span>AuthPortal</span>
    </a>
    
    <ul class="nav-menu">
      <li class="nav-item">
        <a href="index.html" class="nav-link">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="dashboard.html" class="nav-link active">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="profile.html" class="nav-link">
          <i class="fas fa-user"></i>
          <span>Profile</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="login.html" class="nav-link">
          <i class="fas fa-sign-in-alt"></i>
          <span>Login</span>
        </a>
      </li>
    </ul>
    
    <div class="theme-toggle-container">
      <button class="theme-toggle" id="themeToggle"></button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">Dashboard</h1>
    
    <div class="card">
      <div class="info-item">
        <span class="info-label">Signed in as:</span>
        <span class="info-value" id="whoami">Loading...</span>
      </div>
      
      <hr>
      
      <h2 class="card-title">Recent Activity</h2>
      <ul class="activity-list">
        <li class="activity-item">
          <span class="activity-type">Login</span>
          <span class="activity-time">Today, 10:30 AM</span>
        </li>
        <li class="activity-item">
          <span class="activity-type">Password Changed</span>
          <span class="activity-time">Yesterday, 2:15 PM</span>
        </li>
        <li class="activity-item">
          <span class="activity-type">Profile Updated</span>
          <span class="activity-time">April 15, 9:45 AM</span>
        </li>
      </ul>
      
      <hr>
      
      <button class="btn btn-primary" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </main>


  <script type="module" src="/js/auth.js"></script>
  <script>

    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.body.setAttribute('data-theme', currentTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
    
    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
    
        async function loadUser() {
      try {
        const res = await fetch('/api/me', { 
          credentials: 'include'  // FIX: Added credentials
        });
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const me = await res.json();
        document.getElementById('whoami').textContent = `Signed in as: ${me.email || me.uid}`;
      } catch (e) {
        window.location.href = '/login';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await window.__auth.logout();
      window.location.href = '/';
    });

    loadUser();
  </script>
</body>
</html>
